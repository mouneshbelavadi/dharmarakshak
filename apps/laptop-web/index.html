<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHARMARAKSHA — Supreme Multi-Agent Legal Tribunal of India</title>
    <meta name="description" content="DHARMARAKSHA — 3D Judicial Tribunal Chamber and 50-Agent Legal Adjudication System" />
    <!-- Primary CDN font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* Offline fallback — Cinzel-like system serif stack */
      :root {
        --font-serif: "Cinzel", "Trajan Pro", "Palatino Linotype", "Book Antiqua", "Palatino", "Times New Roman", serif;
        --font-display: "Cinzel Decorative", "Cinzel", "Trajan Pro", "Palatino Linotype", serif;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
      }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
      body {
        background: #05070e;
        color: #f8fafc;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Courtroom scrollbar */
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: #07080f; }
      ::-webkit-scrollbar-thumb { background: #2a3554; border-radius: 4px; border: 1px solid rgba(201,168,76,0.18); }
      ::-webkit-scrollbar-thumb:hover { background: #c9a84c; }
    </style>
  </head>
  <body style="margin:0;padding:0;overflow:hidden;background:#05070e;color:#f4f6fb;font-family:Inter,sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
